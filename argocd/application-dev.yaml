# dev = clúster kind del laboratorio. Sincronización AUTOMÁTICA: lo que se mergea en main de
# overlays/dev llega al clúster sin que nadie corra kubectl.
#   prune:    borra del clúster lo que se sacó del repo
#   selfHeal: si alguien cambia algo a mano (drift), Argo CD lo devuelve a lo que dice Git
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feathersforall-dev
  namespace: argocd
spec:
  project: feathersforall
  source:
    repoURL: https://github.com/Erolayer-Cl/feathersforall-gitops.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: feathersforall
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # el namespace lo crea Terraform (cuotas y Pod Security incluidas)
      - PruneLast=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
